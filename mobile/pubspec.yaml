name: shutterbox
description: Shutterbox for Android — your photos and videos, albums, search, slideshows and an encrypted Locked album. A Bytehawk Studio app.
publish_to: none
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  crypto: ^3.0.3
  http: ^1.2.2
  file_picker: ^10.3.3
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  local_auth: ^3.0.2
  flutter_secure_storage: '>=9.2.2 <12.0.0'
  permission_handler: '>=11.3.1 <14.0.0'
  photo_manager: ^3.6.0
  video_player: ^2.9.2
  share_plus: '>=11.0.0 <14.0.0'
  exif: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
