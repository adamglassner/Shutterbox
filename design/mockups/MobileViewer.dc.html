<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutterbox Photo Viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8A33D}a:hover{color:#F4C177}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0B; color: #ECEAE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding-top: 48px">

<header style="display: flex; align-items: center; gap: 6px; padding: 4px 10px 8px">
<a href="MobileLibrary.dc.html" aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ECEAE6; border-radius: 22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1; min-width: 0; text-align: center">
<div style="font-weight: 600; font-size: 15px">Today</div>
<div style="font-size: 12px; color: #A4A8AC">6:42 PM · Big Sur, CA</div>
</div>
<button type="button" aria-label="More options" style="width: 44px; height: 44px; border-radius: 22px; background: transparent; border: 0; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</header>

<div role="img" aria-label="Sunset over the ocean with sea stacks (placeholder)" style="height: 300px; position: relative; background: #5E7A8C; flex: none">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 52%; background: #D99A5B"></div>
<div style="position: absolute; left: 0; right: 0; top: 40%; height: 14%; background: #E8B676"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: #3F5A6B"></div>
<div style="position: absolute; left: 22%; bottom: 30%; width: 70px; height: 92px; border-radius: 30px 36px 0 0; background: #2A2620"></div>
<div style="position: absolute; left: 60%; bottom: 30%; width: 44px; height: 60px; border-radius: 20px 24px 0 0; background: #2A2620"></div>
</div>

<div role="group" aria-label="Nearby photos" style="display: flex; gap: 3px; padding: 10px 12px; overflow: hidden">
<sc-for list="{{strip}}" as="s" hint-placeholder-count="8">
<div style="{{s.style}}"></div>
</sc-for>
</div>

<section aria-label="Details" style="flex: 1; min-height: 0; margin-top: 4px; background: #17191B; border-radius: 20px 20px 0 0; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #3A3E42; align-self: center; margin-top: -8px"></div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Caption</span>
<input type="text" placeholder="Add a caption…" style="background: transparent; border: 0; border-bottom: 1px solid #2C3033; padding: 6px 0 8px; color: #ECEAE6; font: inherit; font-size: 15px; outline: none">
</label>
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #26292C; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CBCE" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"></rect><circle cx="12" cy="13.5" r="3.5"></circle><path d="M8.5 7l1.5-3h4l1.5 3"></path></svg></div>
<div style="min-width: 0">
<div style="font-weight: 500; font-size: 14px">Pixel 9 Pro · 24 mm f/1.7</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A4A8AC; margin-top: 2px">1/500 s · ISO 50 · 12.5 MP · 3.1 MB</div>
</div>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #26292C; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9CBCE" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></div>
<div style="min-width: 0">
<div style="font-weight: 500; font-size: 14px">Pfeiffer Beach</div>
<div style="font-size: 12px; color: #A4A8AC; margin-top: 2px">Big Sur, California</div>
</div>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<span style="font-size: 12px; color: #8D9196; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px">People</span>
<span style="width: 34px; height: 34px; border-radius: 17px; background: #8A6B52; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #FFF">J</span>
<span style="width: 34px; height: 34px; border-radius: 17px; background: #556B7D; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: #FFF">S</span>
<button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; background: transparent; border: 1px dashed #4A4F54; color: #A4A8AC; font: inherit; font-size: 12px">Tag someone</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A4A8AC"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5FCB8B"></span>Backed up to Home Server</div>
</section>

<nav aria-label="Photo actions" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 8px 28px; background: #17191B; border-top: 1px solid #26292C">
<button type="button" style="min-height: 48px; background: transparent; border: 0; color: #C9CBCE; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v7h14v-7"></path></svg>Share</button>
<button type="button" aria-pressed="true" style="min-height: 48px; background: transparent; border: 0; color: {{accent}}; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-8-4.7-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.3 12 20 12 20z"></path></svg>Favorite</button>
<button type="button" style="min-height: 48px; background: transparent; border: 0; color: #C9CBCE; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>Edit</button>
<button type="button" style="min-height: 48px; background: transparent; border: 0; color: #C9CBCE; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 6h16v13H4z"></path><path d="M12 9.5v6M9 12.5h6"></path></svg>Album</button>
<button type="button" style="min-height: 48px; background: transparent; border: 0; color: #C9CBCE; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>Delete</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8A33D","options":["#E8A33D","#5FB3E8","#7FCB8E","#E57B6B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#E8A33D';
    var tones = ['#5E7A8C','#C88B4A','#3F5A6B','#8A6B52','#B9A27D','#4D6650','#7B8F9E','#A3573F','#2F3B45','#D6B98C','#6C5A7A','#94A38A'];
    var strip = [];
    for (var i = 0; i < 9; i++) {
      var a = tones[(i * 5) % tones.length];
      var b = tones[(i * 3 + 7) % tones.length];
      var ring = i === 3 ? ('outline: 2px solid ' + accent + '; outline-offset: 1px;') : 'opacity: 0.75;';
      strip.push({ style: 'width: 36px; height: 48px; flex: none; border-radius: 4px; background: linear-gradient(180deg, ' + a + ' 0 55%, ' + b + ' 55% 100%);' + ring });
    }
    return { accent: accent, strip: strip };
  }
}
</script>
</body>
</html>
