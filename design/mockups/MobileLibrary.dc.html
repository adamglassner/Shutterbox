<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shutterbox Mobile Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8A33D}a:hover{color:#F4C177}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111213; color: #ECEAE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding-top: 48px">

<header style="padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Photos</h1>
<button type="button" aria-label="Search" style="margin-left: auto; width: 44px; height: 44px; border-radius: 22px; background: #1F2224; border: 0; color: #ECEAE6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button type="button" aria-label="Account and server" style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; border: 0; color: #1A1408; font-family: Sora, sans-serif; font-weight: 700; font-size: 16px">A</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #1F2224; border: 1px solid #2C3033">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-9.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"></path><path d="M12 11v6"></path><path d="M9.5 13.5L12 11l2.5 2.5"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; display: flex"><span style="font-weight: 500">Backing up to Home Server</span><span style="margin-left: auto; color: #A4A8AC">24 / 312</span></div>
<div style="height: 4px; border-radius: 2px; background: #2C3033; overflow: hidden"><div style="width: 8%; height: 100%; background: {{accent}}"></div></div>
</div>
</div>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 0 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="padding: 0 18px; display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: Sora, sans-serif; font-size: 15px; font-weight: 600">{{g.date}}</h2><span style="font-size: 12px; color: #A4A8AC">{{g.place}}</span></div>
<div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{g.photos}}" as="p" hint-placeholder-count="6">
<a href="MobileViewer.dc.html" aria-label="{{p.label}}" style="{{p.style}}"></a>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="padding: 10px 18px 0; display: flex; justify-content: center">
<div role="group" aria-label="Zoom" style="display: flex; background: #1F2224; border-radius: 999px; padding: 3px; border: 1px solid #2C3033">
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 999px; background: transparent; border: 0; color: #A4A8AC; font: inherit; font-size: 13px">Years</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 999px; background: transparent; border: 0; color: #A4A8AC; font: inherit; font-size: 13px">Months</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 999px; background: #34383C; border: 0; color: #ECEAE6; font: inherit; font-size: 13px; font-weight: 500">Days</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 999px; background: transparent; border: 0; color: #A4A8AC; font: inherit; font-size: 13px">All</button>
</div>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 28px; border-top: 1px solid #26292C; margin-top: 10px; background: #151618">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: {{accent}}; text-decoration: none; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Photos</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #A4A8AC; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 6h16v13H4z"></path><path d="M7 3h10"></path></svg>Albums</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #A4A8AC; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"></path></svg>People</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px; color: #A4A8AC; text-decoration: none; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.3 10.8l7.4-4.3M8.3 13.2l7.4 4.3"></path></svg>Sharing</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E8A33D","options":["#E8A33D","#5FB3E8","#7FCB8E","#E57B6B"]},"columns":{"editor":"int","default":3,"min":2,"max":5},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#E8A33D';
    var cols = this.props.columns ?? 3;
    var tones = ['#5E7A8C','#C88B4A','#3F5A6B','#8A6B52','#B9A27D','#4D6650','#7B8F9E','#A3573F','#2F3B45','#D6B98C','#6C5A7A','#94A38A','#C4723E','#556B7D','#E0C9A6','#3C4A3A'];
    var mk = function (n, seed) {
      var out = [];
      for (var i = 0; i < n; i++) {
        var a = tones[(i * 5 + seed) % tones.length];
        var b = tones[(i * 3 + seed + 7) % tones.length];
        out.push({ label: 'Open photo ' + (i + 1), style: 'display: block; aspect-ratio: 1; background: linear-gradient(180deg, ' + a + ' 0 55%, ' + b + ' 55% 100%);' });
      }
      return out;
    };
    return {
      accent: accent,
      cols: cols,
      groups: [
        { date: 'Today', place: 'Big Sur, CA', photos: mk(9, 0) },
        { date: 'Wed, Oct 8', place: 'Home', photos: mk(9, 4) },
        { date: 'Sun, Oct 5', place: 'Portland, OR', photos: mk(6, 9) }
      ]
    };
  }
}
</script>
</body>
</html>
